[package]
name = "laser-pointer"
version = "1.2.1"
edition = "2021"
description = "A screen-wide laser pointer and annotation tool for presenting on Windows"
license = "MIT"
readme = "README.md"

[features]
# Development only: LASER_POINTER_RECORD=<file> logs each snappable stroke, for tuning shapes.rs.
record = []

[dependencies]
windows-numerics = "0.3.1"

[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1"

[dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Services_Store",
]

# Only the snapshot tests save PNGs.
[dev-dependencies.windows]
version = "0.62"
features = ["Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_ProcessStatus"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
