name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Package
        shell: pwsh
        run: ./packaging/package.ps1

  # A change that bumps the version releases it once merged, and packaging/whats-new.txt becomes
  # the release notes, so it has to be rewritten for each version.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        env:
          # A pull request is checked out as its merge into the base branch.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          version() { git show "$1:Cargo.toml" | sed -n '/^version = "/{s/^version = "\(.*\)"/\1/p;q}'; }
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            echo "Nothing to compare with"
            exit 0
          fi
          old=$(version "$BASE")
          new=$(version HEAD)
          if [ -z "$new" ]; then echo 'No version in Cargo.toml'; exit 1; fi
          if [ "$old" = "$new" ]; then
            echo "The version stays $new"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- packaging/whats-new.txt; then
            echo "::error file=packaging/whats-new.txt::The version goes from $old to $new: describe v$new in packaging/whats-new.txt"
            exit 1
          fi
          echo "v$new has new notes"
